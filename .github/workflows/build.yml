name: Build

# Chạy mỗi lần có thay đổi trên main, hoặc bấm tay trong tab Actions.
# Nếu repo có file bltm-app.zip: tự giải nén code ra repo rồi xoá file zip.
# Web lên GitHub Pages. APK chỉ build khi bấm tay và chọn "android".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android:
        description: 'Build cả app Android (APK)'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén code (nếu có bltm-app.zip)
        run: |
          if [ -f bltm-app.zip ]; then
            unzip -q -o bltm-app.zip -d /tmp/unpack
            SRC=/tmp/unpack; [ -d /tmp/unpack/bltm-app ] && SRC=/tmp/unpack/bltm-app
            (cd "$SRC" && tar --exclude='./.github' --exclude='./.git' -cf - .) | tar -xf -
            git rm -q --cached bltm-app.zip; rm bltm-app.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Giải nén code từ bltm-app.zip" && git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    needs: web
    # Mỗi lần đưa code mới lên là build lại app; bấm Run workflow thì tuỳ ô đánh dấu
    if: ${{ github.event_name == 'push' || inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Cài Capacitor và tạo project Android
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Biểu tượng và màn hình chờ
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#020b05' --iconBackgroundColorDark '#020b05' --splashBackgroundColor '#020b05' --splashBackgroundColorDark '#020b05'
      - name: Số phiên bản và khoá ký cố định (để cài đè bản mới được)
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android && cp android-keystore/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ban-lo-tru-ma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ban-lo-tru-ma-apk
          path: ban-lo-tru-ma.apk
          if-no-files-found: error
      - name: Đăng lên Releases (link tải cố định)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: App Android mới nhất
          make_latest: true
          files: ban-lo-tru-ma.apk
          body: |
            Bản build số ${{ github.run_number }}. Tải file ban-lo-tru-ma.apk bên dưới, mở để cài.
            Lần đầu cài, Android sẽ hỏi cho phép cài từ nguồn ngoài: bấm cho phép.
