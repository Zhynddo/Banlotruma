<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7efdf">
<meta name="description" content="Truyện ma, sổ phép, nghi lễ và hồ sơ nhân vật của Bán Lộ Trừ Ma">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="./app.css">
<script>
  // Đặt theme trước khi vẽ trang để không bị nháy màu
  (function () {
    var t = 'bao-cao';
    try { t = JSON.parse(localStorage.getItem('bltm.theme')) || t; } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div id="root"><p style="font-family:monospace;padding:24px">&gt; đang khởi động...</p></div>
